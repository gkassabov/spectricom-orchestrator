# OI-026 v3.4 multi-repo config
# Per spec: OI-026-orchestrator-v3-4-multi-repo-spec-v1-2.md
# Loaded by orchestrator.py via load_repo_config()
# No default repo (ORCH-YORSIE-SAFETY-1, S7-CORE-17): every brief names its repo — `#!queue repo=…`,
# `## Repo:` or --repo — or is refused. load_repo_config() refuses a `default:` key on any entry.

# ORCH-CONTROL-SCOPE-1 (S7-CORE-19) C3 · A1: prefire.py reads the newest SCP_Kanban_v*.md /
# Yorsie_Kanban_v*.md here and fires a brief only from the READY row its `## Kanban:` line names.
kanban_dir: /mnt/c/Users/gkass/OneDrive/Documents/Spectricom
# ORCH-LANE-1 (S7-CORE-19) O4: the families a brief's `## Kanban: <family> row <N>` line may name. A family
# added here (its <family>_v*.md in kanban_dir) is read by A1 with no code change.
kanban_families:
  - SCP_Kanban
  - Yorsie_Kanban

# ORCH-CONTROL-SCOPE-1 C7a: the PATH systemd/spectricom-queue-daemon.service runs the daemon with — a
# user unit sources no .bashrc. nvm's node first (the gates run npm), then ~/.local/bin (`claude`): the
# order the hand-started daemon had. scripts/install-queue-daemon-unit.sh renders it into the unit.
daemon_path: /home/gkassa/.nvm/versions/node/v22.22.1/bin:/home/gkassa/.local/bin:/home/gkassa/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# ORCH-CAPACITY-1 (S7-CORE-21) · L-70: one Toni route at a time, and only with memory to spare. admission.py
# reads this block at every fire, for the queue daemon (a refusal WAITS; `status` shows `waiting: …`) and for a
# direct `orchestrator.py run` (a refusal is exit 2; --force bypasses and says so). Tunable here, no release:
#   max_concurrent_routes  live routes across EVERY repo (a live state/running*.json marker, pid alive) — 1
#   min_mem_available_gib  MemAvailable in /proc/meminfo below this ⇒ no new route — 6
#   gate_budget_s          (C4) the daemon's route wall is the brief's route timeout + this + 900 s slack. Absent
#                          ⇒ per repo, the sum of that repo's gate timeouts; a number, or {<repo>: <seconds>}.
admission:
  max_concurrent_routes: 1
  min_mem_available_gib: 6

repos:
  yorsie:
    project_dir: /home/gkassa/spectricom-dev-pipeline
    branch_prefix: orch
    merge_target: main
    remote: origin
    log_subdir: yorsie
    # ORCH-CONTROL-SCOPE-1 C4 (YORSIE-WORKTREE-1): honoured by `run` — the route runs, is gated and merges
    # in <worktree_base>/<route>; this tree (yorsie-dev.service :5175) is never the route's.
    worktree_mode: parallel
    worktree_base: /home/gkassa/yorsie-toni
    briefs_subdir: yorsie/briefs
    test_cmd: "cd yorsie && npm test"
    # ORCH-YORSIE-SAFETY-1 Y2: Yorsie merges only what builds (`tsc -b && vite build`). PRE_MERGE_GATES
    # in orchestrator.py gates yorsie with ("build",), env_file None — yorsie/.env is never sourced.
    build_gate_cmd: "cd yorsie && npm run build"

  ai-foundation:
    project_dir: /home/gkassa/spectricom-ai-foundation
    branch_prefix: orch-aif
    merge_target: main
    remote: origin
    log_subdir: ai-foundation
    # ORCH-AIF-WORKTREE-FLIP-1 (L-71): parallel since route 134 merged — ai-foundation 3cfb727d, .gitignore `venv`.
    worktree_mode: parallel
    worktree_base: /home/gkassa/aif-toni
    briefs_subdir: briefs
    test_cmd: ". venv/bin/activate && PYTHONPATH=. pytest"
    build_gate_cmd: ". venv/bin/activate && PYTHONPATH=. pytest -q"

  clinical-mp:
    project_dir: /home/gkassa/spectricom-clinical-mp
    branch_prefix: orch-mp
    merge_target: main
    remote: origin
    log_subdir: clinical-mp
    worktree_mode: single-stream
    briefs_subdir: briefs
    test_cmd: "npm test"
    # S7-CORE-9: the 900s default is NOT enough for this repo's branch leg. Measured
    # 2026-09-13 on the RM-I-021 route: the warm-checkout branch run reached 898.3s and was
    # killed at 900 with no summary parsed — BLOCKED(environment), nothing merged. `npm test`
    # here is the whole repo (773 files / 7103 tests). The [ORCH-5] comment claiming the
    # branch leg "fits in 900s on a warm checkout" was measured once, optimistically.
    test_timeout_s: 1800
    # S7-CORE-10 SIT-RATE-1 (measured 2026-09-15 @181a109): 19 SIT files in ONE gate run =
    # `_consumedPoints 50090` against Medplum's `limit: 50000` → HTTP 429 in the harness login
    # (each file's login provisions a Practitioner; cost scales with file count). The same
    # commit in two halves 90 s apart: 10 files/29 tests + 9 files/31 tests, all green.
    # `sit_list_cmd` enumerates the suite (`file > test` per line) WITHOUT running it: it is
    # both the batch source and the whole-suite count the batches must sum to (AC-SR-05).
    # Absent ⇒ one unbatched run. Batch size / pause default to SIT_BATCH_FILES /
    # SIT_BATCH_PAUSE_S in orchestrator.py; each SIT_TIMEOUT is the budget of one batch.
    sit_list_cmd: "npx vitest list --config vitest.sit.config.ts"
    sit_batch_files: 10
    # D-S7CORE31-03 (S7-CORE-31, George 2026-10-17 12:48 "do 2"): no pause between batches on this LOCAL dev stack —
    # both Medplum limiters are off here (MEDPLUM_DEFAULT_RATE_LIMIT -1, MEDPLUM_DEFAULT_FHIR_QUOTA 1000000) and no
    # recent gate log shows a 429. Back to 90 on the first 429. Was 90.
    sit_batch_pause_s: 0
    # ORCH-GATE-COST-1 (S7-CORE-30, D-S7CORE29-02): per merge, SIT runs the files RELATED to the branch's diff —
    # the installed vitest's own `list --changed <merge base>` (files only, nothing run), plus the SIT files the
    # branch changes, plus an optional core set:
    #   sit_core_files: [sit/integration/<file>.integration.test.ts, ...]   # absent ⇒ none; not set (Gemma decides)
    # The FULL SIT + unit suites run nightly — `orchestrator.py full-gate --repo clinical-mp`, by the queue daemon
    # once per local day at or after this time, only while it is running and idle — and on demand before a
    # tester session. Quoted: unquoted, YAML reads 02:30 as the integer 150.
    full_gate_nightly: "02:30"
    # ORCH-FULLGATE-LOCAL-FILES-1 (S7-CORE-31): git-ignored files the full gate's detached worktree needs and does
    # not get from git — symlinked in from this checkout beside the dependency trees, by path, never read. The
    # first full gate (2026-10-16, a4f0e18) lost 31 SIT files at setup without this one: probe-identity.ts reads
    # it when ADMIN_PASSWORD is unset. A listed file this checkout lacks ⇒ SIT BLOCKED before any batch, named.
    full_gate_link_files: [".medplum-admin-credentials.local"]

  orchestrator:
    project_dir: /home/gkassa/spectricom-orchestrator
    branch_prefix: orch-orch
    merge_target: main
    remote: origin
    log_subdir: orchestrator
    worktree_mode: single-stream
    meta_fire: true
    briefs_subdir: briefs
    test_cmd: "pytest -q tests/"
    build_gate_cmd: "pytest -q tests/"   # AC-ORCH1-09: meta-fire pre-merge gate (PRE_MERGE_GATES in orchestrator.py)

  # Future repos (scaffolded per S5S37 decision #6, NOT LIVE):
  # gateway: (Spectricom Gateway repo, Phase 3+)

  collateral:
    project_dir: /home/gkassa/spectricom-collateral
    branch_prefix: orch-col
    merge_target: main
    remote: origin
    log_subdir: collateral
    worktree_mode: single-stream
    briefs_subdir: briefs
    test_cmd: "echo 'collateral: no automated suite — acceptance per brief section 7 rendered-UI verification'"

  norra:
    project_dir: /home/gkassa/norra
    branch_prefix: orch-norra
    merge_target: main
    remote: origin
    log_subdir: norra
    worktree_mode: single-stream
    briefs_subdir: briefs
    test_cmd: ". venv/bin/activate && PYTHONPATH=. pytest"
    build_gate_cmd: ". venv/bin/activate && PYTHONPATH=. pytest -q"
