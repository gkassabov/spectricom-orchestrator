    # ORCH-FULLGATE-CACHE-1: the nightly full gate uses a judged full-suite measurement of its own tree, no older
    # than this many hours, as its unit leg, and does not run the suite again. Set ORCH_FULLGATE_REUSE=off to
    # always run it.
    full_gate_reuse_max_h: 24
    # ORCH-FULLGATE-WT-FSDENY-1 (Kanban 601): after its unit leg the full gate compares the tests it collected with
    # the same tree's cached measurement (a drop above full_gate_collection_drop_same_pct percent is
    # BLOCKED(environment)), else with the MAX of the nearest full_gate_collection_ref_n measured ancestors (above
    # full_gate_collection_drop_pct percent), after subtracting the tests in test files deleted since. Any drop is
    # never cached. ORCH_UNIT_LOAD_CHECK=off skips the check (and the unit legs' vite-fs-deny signal).
    full_gate_collection_drop_pct: 2
    full_gate_collection_drop_same_pct: 0.5
    full_gate_collection_ref_n: 5
    # ORCH-PREFLIGHT-READMAP-1 (Kanban 601, 341n6b F-1): test files the import graph cannot relate to a diff. The
    # read-map pin test reads docs/portal-read-map.md and the call-site files it names with readFileSync, so
    # `vitest --changed` never selects it for them: a diff touching the map, or a tracked file the map names in
    # backticks, adds it to the related set (the unit scope line says `+ N declared extra (unit_related_extra: …)`).
    unit_related_extra:
      - when: ["docs/portal-read-map.md"]
