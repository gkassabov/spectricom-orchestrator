    # route whose diff changes non-test source. ORCH_UNIT_ALWAYS=off drops them. ORCH-LEAN-GATE-1 (TC-6): a guard is
    # kept per route by RISK, not by stopwatch — every listed guard matching unit_always_risk_globs runs per route
