# OpenShell v0.1.5 gateway for ORCH-OPENSHELL-EVAL-1 (339a) — scratch only, loopback, no TLS (local spike).
[openshell]
version = 2

[openshell.gateway]
bind_address   = "127.0.0.1:17670"
log_level      = "info"
compute_driver = "docker"
disable_tls    = true

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/home/gkassa/_eos/s7core33/openshell-eval/state/tls/jwt/signing.pem"
public_key_path  = "/home/gkassa/_eos/s7core33/openshell-eval/state/tls/jwt/public.pem"
kid_path         = "/home/gkassa/_eos/s7core33/openshell-eval/state/tls/jwt/kid"
gateway_id       = "openshell-eval-339a"

[openshell.drivers.docker]
socket_path             = "/var/run/docker.sock"
default_image           = "toni-openshell-eval:spike"
sandbox_runtime_image   = "ghcr.io/nvidia/openshell/sandbox:0.1.5"
supervisor_image        = "ghcr.io/nvidia/openshell/supervisor:0.1.5"
image_pull_policy       = "never"
sandbox_label           = "openshell-eval-339a"
app_armor_profile       = "Unconfined"
supervisor_network_mode = "bridge"
grpc_endpoint           = "http://host.docker.internal:17670"
allow_driver_config     = true
enable_bind_mounts      = true

[openshell.drivers.docker.resource_admission]
enabled = false
